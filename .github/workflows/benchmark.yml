name: benchmark
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - spike-core/src/**
      - spike-compiler/src/main/**
      - spike-benchmark/**
      - gradle/libs.versions.toml

permissions:
  contents: write

concurrency: benchmark

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: |
          curl -s "https://get.sdkman.io?ci=true" | bash
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          sdk install gradleprofiler
          echo "SDKMAN_DIR=$HOME/.sdkman" >> $GITHUB_ENV
          echo "$HOME/.sdkman/candidates/gradleprofiler/current/bin" >> $GITHUB_PATH

      - run: bash spike-benchmark/benchmark.sh

      - if: success() || failure()
        run: cat spike-benchmark/output/results.md >> $GITHUB_STEP_SUMMARY

      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Spike
          tool: 'customSmallerIsBetter'
          output-file-path: spike-benchmark/output/results-spike.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          alert-threshold: '130%'
          comment-on-commit: true
          fail-on-alert: true

      - if: success() || failure()
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Baselines
          tool: 'customSmallerIsBetter'
          output-file-path: spike-benchmark/output/results-baselines.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          comment-on-commit: false
          fail-on-alert: false
